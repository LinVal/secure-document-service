spring:
  application:
    name: dokument-service
  jpa:
    open-in-view: false   # Avoid lazy-loading pitfalls over HTTP

  # Actuator – expose only the health endpoint (SecurityConfig already permits it)
  management:
    endpoint:
      health:
        probes:
          enabled: true       # Enables /actuator/health/liveness and /readiness
    endpoints:
      web:
        exposure:
          include: health     # Nothing else is exposed

  # Spring's own multipart guard – first line of defence.
  # FileValidator enforces the same limit in code as defence-in-depth.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# ──────────────────────────────────────────────
# File storage defaults (overridden per environment via env vars)
# uploadDirectory MUST be outside the servlet container's web root.
# ──────────────────────────────────────────────
app:
  storage:
    upload-directory: ${STORAGE_DIR:/tmp/sds-uploads}
    max-file-size-bytes: 10485760   # 10 MB – must match spring.servlet.multipart.max-file-size
    allowed-content-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - image/jpeg
      - image/png

---
# ──────────────────────────────────────────────
# DEV profile – H2 in-memory, H2 console enabled
# Run with: --spring.profiles.active=dev
# ──────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:sdsdev;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none          # Schema definieras manuellt i schema.sql
    defer-datasource-initialization: true   # Kör schema.sql innan Hibernate startar
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Point to your local Keycloak realm when running dev
          issuer-uri: http://localhost:8180/realms/sds

---
# ──────────────────────────────────────────────
# PROD profile – MySQL, secrets via env vars
# Run with: --spring.profiles.active=prod
# ──────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
